[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entitytrace"
version = "0.1.0"
description = "工具形态：面向 agent 的插件核心；功能定位：小说实体发现、身份判断与归组、原文证据回溯"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
entitytrace = "entitytrace.cli:main"

[tool.setuptools.packages.find]
include = ["entitytrace*"]
